    <!--
      Runs after the canonical and robots tags exist.
      Public pages stay indexable. Account, checkout, shop handoff, and product
      shells are noindex — those URLs are not the pages we want in Google.
    -->
    <script>
      (function () {
        var PUBLIC = 'https://peplab.com.au';
        var path = (location.pathname || '/').replace(/\/+$/, '') || '/';
        var url = PUBLIC + (path === '/' ? '/' : path);
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.setAttribute('href', url);
        var ogUrl = document.querySelector('meta[property="og:url"]');
        if (ogUrl) ogUrl.setAttribute('content', url);
        var au = document.querySelector('link[rel="alternate"][hreflang="en-AU"]');
        var xd = document.querySelector('link[rel="alternate"][hreflang="x-default"]');
        if (au) au.setAttribute('href', url);
        if (xd) xd.setAttribute('href', url);

        var publicExact = {
          '/': 1,
          '/landing': 1,
          '/coa': 1,
          '/calculator': 1,
          '/leaderboard': 1,
          '/standards': 1,
          '/contact-info': 1,
          '/contact': 1,
          '/faq': 1,
          '/shipping': 1,
          '/track-order': 1,
          '/terms': 1,
          '/privacy': 1,
          '/refund': 1,
          '/legal': 1,
          '/research': 1,
          '/research/compounds': 1
        };
        var isResearchCompound = /^\/research\/compounds\/[^/]+$/.test(path);
        if (publicExact[path] || isResearchCompound) return;
        var robots = document.querySelector('meta[name="robots"]');
        if (robots) robots.setAttribute('content', 'noindex, nofollow');
        if (path === '/login' || path === '/signup' || path === '/forgot-password' || path === '/reset-password') {
          document.title = 'PEPLAB | Sign in';
        }
      })();

    <script>
      (function () {
        var raw = '%VITE_LOGIN_ONLY_HOSTS%';
        var hosts = raw.split(',').map(function (s) { return s.trim().toLowerCase(); }).filter(Boolean);
        if (!hosts.length) return;
        var h = location.hostname.toLowerCase();
        var full = location.host.toLowerCase();
        var loginOnly = hosts.indexOf(h) !== -1 || hosts.indexOf(full) !== -1;
        if (!loginOnly) return;
        var path = (location.pathname || '/').replace(/\/+$/, '') || '/';
        var authEntry = path === '/login' || path === '/signup' || path === '/forgot-password' || path === '/reset-password';
        if (!authEntry) return;
        var title = 'PEPLAB | Sign in';
        var description = 'Sign in to your PEPLAB account. Member access for existing customers.';
        document.title = title;
        var eyebrow = document.getElementById('app-loading-eyebrow');
        if (eyebrow) eyebrow.textContent = 'SIGN IN';
        function setMeta(sel, content) {
          var el = document.querySelector(sel);
          if (el) el.setAttribute('content', content);
        }
        setMeta('meta[name="description"]', description);
        setMeta('meta[name="robots"]', 'noindex, nofollow');
        setMeta('meta[property="og:title"]', title);
        setMeta('meta[property="og:description"]', description);
        setMeta('meta[property="og:site_name"]', 'PEPLAB');
        setMeta('meta[name="twitter:title"]', title);
        setMeta('meta[name="twitter:description"]', description);
      })();
    </script>
